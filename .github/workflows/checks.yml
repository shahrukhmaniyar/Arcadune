name: Checks

# The same checks as docs/RELEASE_CHECKLIST.md step 1, but only when started by hand (Actions tab >
# Checks > Run workflow). It is NOT run on every push yet: GitHub cannot download the emulator
# cores repo (lemuroid-cores) because four of its files are symlinks with an empty target, so the job
# stops before the first check. To turn it back on: remove those four entries from ArcaduneCores
# (arm/x86/x86_64 libcitra, x86_64 libppsspp under bundled-cores/src/main/jniLibs), update the
# submodule here, make the job build on GitHub, and restore the push and pull_request triggers.
# Releases are built and signed by hand (the signing key never leaves the maintainer PC), so nothing
# here builds release APKs or publishes anything.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Style (ktlint)
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew test

      - name: Lint (release build)
        run: ./gradlew :lemuroid-app:lintFreeBundleRelease

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
