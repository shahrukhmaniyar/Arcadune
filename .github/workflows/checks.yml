name: Checks

# Runs the same checks as docs/RELEASE_CHECKLIST.md step 1 on every push and pull request.
# Releases are built and signed by hand (the signing key never leaves the maintainer's PC),
# so nothing here builds release APKs or publishes anything.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Style (ktlint)
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew test

      - name: Lint (release build)
        run: ./gradlew :lemuroid-app:lintFreeBundleRelease

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
